name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Windows-only: the crate links Win32 APIs directly and will not build elsewhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs embeds item names from third_party/warframe-public-export-plus.
          submodules: true

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets

      # The ignored notification test is skipped here: it pops a real desktop toast.
      - run: cargo test

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: warframe-peer-overlay
          path: target/release/warframe-peer-overlay.exe
