[package]
name = "warframe-peer-overlay"
version = "0.1.0"
edition = "2024"
# Let-chains (`if let Some(x) = y && z`) are used throughout and stabilised in 1.88.
rust-version = "1.88"
description = "Warframeの分隊ピア情報を表示するWindows向けオーバーレイ"
repository = "https://github.com/synqark/warframe-peer-overlay"
license = "Unlicense"
readme = "README.md"
keywords = ["warframe", "overlay", "windows"]
categories = ["games"]

[dependencies]
base64 = "0.22"
directories = "6.0"
# `wayland`/`x11` are deliberately omitted: this binary is Windows-only.
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }
iso_country = "0.1.4"
# Finds loadout strings in the game's memory. Already built as part of `regex`.
memchr = "2"
regex = "1.12"
rs-grid-icons = "0.1.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: a loadout keeps the order the game wrote it in, both in the files saved
# and in what a card hands to the clipboard, rather than coming back sorted by key.
serde_json = { version = "1.0", features = ["preserve_order"] }
sysinfo = "0.39.6"
tray-icon = "0.24.2"
# Diagnostics_Debug and Memory: read-only access to the game's memory for loadout capture.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tauri-winrt-notification = "0.8.1"

[build-dependencies]
# build.rs turns the warframe-public-export-plus submodule into the embedded names table.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
