[package]
name = "warframe-peer-overlay"
version = "0.1.0"
edition = "2024"
# Let-chains (`if let Some(x) = y && z`) are used throughout and stabilised in 1.88.
rust-version = "1.88"
description = "Warframeの分隊ピア情報を表示するWindows向けオーバーレイ"
repository = "https://github.com/synqark/warframe-peer-overlay"
license = "Unlicense"
readme = "README.md"
keywords = ["warframe", "overlay", "windows"]
categories = ["games"]

[dependencies]
base64 = "0.22"
directories = "6.0"
# `wayland`/`x11` are deliberately omitted: this binary is Windows-only.
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }
iso_country = "0.1.4"
regex = "1.12"
rs-grid-icons = "0.1.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tauri-winrt-notification = "0.8.1"
